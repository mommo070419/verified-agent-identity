name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install ClawHub Skill
        run: npx clawhub@latest install verified-agent-identity --force

      - name: Install Dependencies
        run: |
          cd scripts
          npm install

      - name: Create Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Link Human To Agent
        run: node scripts/manualLinkHumanToAgent.js --challenge '{"name":"mommo","description":"mommo AI Agent"}'
