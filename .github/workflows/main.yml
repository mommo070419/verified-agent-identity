name: Verify Human Identity

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Install Verified Agent Skill
        run: clawhub install verified-agent-identity --force

      - name: Install Script Dependencies
        run: |
          cd scripts
          npm install

      - name: Create Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Link Human To Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name":"mommo","description":"mommo AI Agent"}'

      - name: Done
        run: echo "Agent verification workflow finished"
